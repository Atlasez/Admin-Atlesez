name: Preview parity refactor artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/member-portal-workflows
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Remove duplicated published article rendering rules
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/pages/atlas/[locale]/[subject]/[category]/[slug].astro';
          let source = fs.readFileSync(path, 'utf8');

          const cssStartMarker = '  .article-body {\n    margin-block: var(--space-3);\n  }\n';
          const cssEndMarker = '  .article-refs,\n  .article-footer {';
          const cssStart = source.indexOf(cssStartMarker);
          if (cssStart >= 0) {
            const cssEnd = source.indexOf(cssEndMarker, cssStart);
            if (cssEnd < 0) throw new Error('Could not locate article-body CSS end');
            source = source.slice(0, cssStart) + source.slice(cssEnd);
          }

          const mathStartMarker = '    // 数学記事のPandoc風マークアップを、読みやすいカードと折りたたみ証明へ整える。';
          const mathStart = source.indexOf(mathStartMarker);
          if (mathStart >= 0) {
            const tail = '\n    }\n  }\n</script>';
            const mathEnd = source.indexOf(tail, mathStart);
            if (mathEnd < 0) throw new Error('Could not locate legacy math normalizer end');
            source = source.slice(0, mathStart) + source.slice(mathEnd + '\n    }\n'.length);
          }

          fs.writeFileSync(path, source);
          NODE
      - name: Add source-of-truth regression test
        run: |
          cat > tests/unit/article-preview-parity-source.test.ts <<'EOF'
          import { readFile } from "node:fs/promises";
          import { describe, expect, it } from "vitest";

          const readSource = (path: string) =>
            readFile(new URL(`../../${path}`, import.meta.url), "utf8");

          describe("article preview parity source of truth", () => {
            it("keeps article content CSS out of the published page and admin overrides", async () => {
              const [publishedPage, adminLayout] = await Promise.all([
                readSource("src/pages/atlas/[locale]/[subject]/[category]/[slug].astro"),
                readSource("src/layouts/AdminLayout.astro"),
              ]);

              expect(publishedPage).not.toContain(".article-body :global(");
              expect(adminLayout).toContain('import "../styles/article-content.css";');
              expect(adminLayout).not.toContain("admin-published-preview.css");
            });

            it("uses the same Markdown and math-structure modules for public and admin rendering", async () => {
              const [astroConfig, atlasLayout, previewScript] = await Promise.all([
                readSource("astro.config.mjs"),
                readSource("src/layouts/AtlasLayout.astro"),
                readSource("src/scripts/admin-editor-subject-preview.ts"),
              ]);

              expect(astroConfig).toContain("ARTICLE_MARKDOWN_PROCESSOR_OPTIONS");
              expect(previewScript).toContain("ARTICLE_MARKDOWN_PROCESSOR_OPTIONS");
              expect(atlasLayout).toContain('import "../scripts/article-math-structure";');
              expect(previewScript).toContain('from "./article-math-structure"');
            });
          });
          EOF
      - name: Format affected files
        run: |
          npx prettier --write \
            astro.config.mjs \
            src/layouts/AdminLayout.astro \
            src/layouts/AtlasLayout.astro \
            src/lib/article-directives.mjs \
            src/lib/article-markdown.mjs \
            src/lib/editor-directives.ts \
            src/scripts/admin-editor-navigation-guard.ts \
            src/scripts/admin-editor-published-math-preview.ts \
            src/scripts/admin-editor-realtime-cursors-yjs.ts \
            src/scripts/admin-editor-realtime-cursors.ts \
            src/scripts/admin-editor-subject-preview.ts \
            src/scripts/article-math-structure.ts \
            src/styles/article-content.css \
            'src/pages/atlas/[locale]/[subject]/[category]/[slug].astro' \
            tests/unit/admin-editor-subject-preview.test.ts \
            tests/unit/article-math-structure.test.ts \
            tests/unit/article-preview-parity-source.test.ts
      - name: Commit verified refactor
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            astro.config.mjs \
            src/layouts/AdminLayout.astro \
            src/layouts/AtlasLayout.astro \
            src/lib/article-directives.mjs \
            src/lib/article-markdown.mjs \
            src/lib/editor-directives.ts \
            src/scripts/admin-editor-navigation-guard.ts \
            src/scripts/admin-editor-published-math-preview.ts \
            src/scripts/admin-editor-realtime-cursors-yjs.ts \
            src/scripts/admin-editor-realtime-cursors.ts \
            src/scripts/admin-editor-subject-preview.ts \
            src/scripts/article-math-structure.ts \
            src/styles/article-content.css \
            'src/pages/atlas/[locale]/[subject]/[category]/[slug].astro' \
            tests/unit/admin-editor-subject-preview.test.ts \
            tests/unit/article-math-structure.test.ts \
            tests/unit/article-preview-parity-source.test.ts
          git commit -m "centralize published article preview rendering"
          git push origin HEAD:codex/member-portal-workflows
