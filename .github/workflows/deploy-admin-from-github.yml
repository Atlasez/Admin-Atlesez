name: Deploy admin from GitHub

on:
  workflow_dispatch:
    inputs:
      confirm_main:
        description: "mainの内容を本番へ反映することを確認しました"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-admin-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 812021e62fa20465950b61be55dfe064

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_main == true
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment target
        run: npm run verify:deploy-config

      - name: Build admin assets
        env:
          ATLASEZ_BUILD_TARGET: admin
          SITE_URL: https://admin.atlasez.org
          BASE_PATH: /
        run: npm run build

      - name: Verify build identity
        run: npm run verify:build-info

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply atlasez-reports --remote --config wrangler.admin.jsonc

      - name: Deploy admin Worker
        run: npx wrangler deploy --config wrangler.admin.jsonc --keep-vars

      - name: Verify production build identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(curl --fail --silent --show-error https://admin.atlasez.org/build-info.json)"
          printf '%s\n' "$actual"
          ACTUAL_BUILD_INFO="$actual" EXPECTED_COMMIT="${GITHUB_SHA}" node --input-type=module <<'NODE'
          const actual = JSON.parse(process.env.ACTUAL_BUILD_INFO);
          const expected = process.env.EXPECTED_COMMIT;
          if (actual.commit !== expected) {
            throw new Error(`本番build-infoのCommitが不一致です: ${actual.commit} !== ${expected}`);
          }
          NODE
