name: Deploy ADMIN from GitHub

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deploy-admin-production
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment target
        run: npm run verify:deploy-config

      - name: Type and content checks
        run: |
          npm run check
          node scripts/validate-content.mjs
          npm run audit:math

      - name: Lint, format, and tests
        run: |
          npm run lint
          npm run format:check
          npm test

      - name: Build ADMIN assets
        env:
          ATLASEZ_BUILD_TARGET: admin
          SITE_URL: https://admin.atlasez.org
          BASE_PATH: /
          CF_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CF_BRANCH: main
        run: npm run build

      - name: Verify build identity
        env:
          EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: npm run verify:build-info

      - name: Verify ADMIN build metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const info = JSON.parse(await readFile("dist/build-info.json", "utf8"));
          if (
            info.repository !== "Atlasez/Admin-Atlesez" ||
            info.commit !== process.env.DEPLOY_SHA ||
            info.ref !== "main" ||
            info.target !== "admin"
          ) {
            throw new Error(`ADMIN build identity mismatch: ${JSON.stringify(info)}`);
          }
          NODE

      - name: Wrangler deployment dry run
        run: npx wrangler deploy --dry-run --config wrangler.admin.jsonc --keep-vars

      - name: Upload verified ADMIN assets
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist-${{ github.event.workflow_run.head_sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 812021e62fa20465950b61be55dfe064
      NO_COLOR: "1"
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified ADMIN assets
        uses: actions/download-artifact@v4
        with:
          name: admin-dist-${{ github.event.workflow_run.head_sha || github.sha }}
          path: dist/

      - name: Recheck deployment target and build identity
        env:
          EXPECTED_COMMIT_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          npm run verify:deploy-config
          npm run verify:build-info

      - name: Confirm main has not advanced before deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          latest_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "$latest_main" != "$DEPLOY_SHA" ]; then
            echo "main advanced while this deployment was waiting; refusing to publish stale SHA $DEPLOY_SHA (latest $latest_main)." >&2
            exit 1
          fi

      - name: Deploy ADMIN Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.admin.jsonc --keep-vars

      - name: Verify 100 percent production traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(npx wrangler deployments status --config wrangler.admin.jsonc 2>&1)"
          printf '%s\n' "$status"
          if ! grep -Fq '(100%)' <<<"$status"; then
            echo "atlasez-adminのProduction配信が100%ではありません。" >&2
            exit 1
          fi

      - name: Verify live ADMIN build identity
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if EXPECTED_COMMIT="$DEPLOY_SHA" npm run verify:live-admin-production; then
              echo "本番build-infoを検証しました（試行 ${attempt}/12）。"
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          echo "ADMIN本番のbuild-infoが対象SHAに一致しません。" >&2
          exit 1
