# The legacy filename is retained to replace the old workflow on merge.
# Verification only. Production deployment is Cloudflare Workers Builds / main.
name: Verify ADMIN build only

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: verify-admin-build
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment target
        run: npm run verify:deploy-config

      - name: Type and content checks
        run: |
          npm run check
          node scripts/validate-content.mjs
          npm run audit:math

      - name: Lint, format, and tests
        run: |
          npm run lint
          npm run format:check
          npm test

      - name: Build ADMIN assets
        env:
          ATLASEZ_BUILD_TARGET: admin
          SITE_URL: https://admin.atlasez.org
          BASE_PATH: /
          CF_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CF_BRANCH: main
        run: npm run build

      - name: Verify build identity
        env:
          EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: npm run verify:build-info

      - name: Verify ADMIN build metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const info = JSON.parse(await readFile("dist/build-info.json", "utf8"));
          if (
            info.repository !== "Atlasez/Admin-Atlesez" ||
            info.commit !== process.env.BUILD_SHA ||
            info.ref !== "main" ||
            info.target !== "admin"
          ) {
            throw new Error(`ADMIN build identity mismatch: ${JSON.stringify(info)}`);
          }
          NODE

      - name: Wrangler deployment dry run
        run: npx wrangler deploy --dry-run --config wrangler.admin.jsonc --keep-vars

      - name: Upload verified ADMIN assets
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist-${{ github.event.workflow_run.head_sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
