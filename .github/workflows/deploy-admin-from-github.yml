name: Deploy admin from GitHub

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-admin-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 812021e62fa20465950b61be55dfe064

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment target
        run: npm run verify:deploy-config

      - name: Build admin assets
        env:
          ATLASEZ_BUILD_TARGET: admin
          SITE_URL: https://admin.atlasez.org
          BASE_PATH: /
        run: npm run build

      - name: Verify build identity
        run: npm run verify:build-info

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply atlasez-reports --remote --config wrangler.admin.jsonc

      - name: Deploy admin Worker
        run: npx wrangler deploy --config wrangler.admin.jsonc --keep-vars

      - name: Verify production build identity
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=12
          for attempt in $(seq 1 "$max_attempts"); do
            if actual="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 https://admin.atlasez.org/build-info.json)"; then
              printf '%s\n' "$actual"
              if ACTUAL_BUILD_INFO="$actual" EXPECTED_COMMIT="${GITHUB_SHA}" node --input-type=module <<'NODE'
              const actual = JSON.parse(process.env.ACTUAL_BUILD_INFO);
              const expected = process.env.EXPECTED_COMMIT;
              if (actual.commit !== expected || actual.repository !== "Atlasez/Admin-Atlesez" || actual.target !== "admin") {
                throw new Error(`本番build-infoの身元が不一致です: ${JSON.stringify(actual)} (expected commit ${expected}, target admin)`);
              }
          NODE
              then
                echo "本番build-infoを確認しました（試行 ${attempt}/${max_attempts}）。"
                exit 0
              fi
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 5))
              echo "本番への反映を待機します（${delay}秒後に再確認、試行 ${attempt}/${max_attempts}）。"
              sleep "$delay"
            fi
          done
          echo "本番build-infoが${max_attempts}回の確認後も対象SHAに一致しません。" >&2
          exit 1
