name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: Node.js を準備
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 依存関係をインストール
        run: npm ci
      - name: GitHub Pages 用にビルド
        run: npm run build
        env:
          SITE_URL: https://mitukx.github.io
          BASE_PATH: /Atlasez01
      - name: 公開用ファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: GitHub Pages に公開
        id: deployment
        uses: actions/deploy-pages@v4
