# CI: PR・mainへのpushで内容を検証する。
# 本番配信は GitHub Pages 用の deploy-pages.yml と Cloudflare の自動ビルドで行うため、
# このワークフローは検証だけを担当する。
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # 本番と同じパス構成（ルート配信）で検証する。
  # SITE_URL は設定しない＝ビルドは noindex 付きになるが、検証には影響しない。
  BASE_PATH: /

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 依存関係のインストール
        run: npm ci
      - name: Cloudflare本番ターゲット検証
        run: npm run verify:deploy-config
      - name: コンテンツスキーマ・重複ID・循環検査
        run: node scripts/validate-content.mjs
      - name: 数式のKaTeX描画検査
        run: npm run audit:math
      - name: TypeScriptチェック
        run: npx astro check
      - name: Lint
        run: npm run lint
      - name: Formatチェック
        run: npm run format:check
      - name: 単体テスト
        run: npm test
      - name: ビルド（下書きは除外される）
        run: npm run build:ci
      - name: 検索インデックス生成
        run: npx pagefind --site dist
      - name: ビルド成果物のcommit SHA検証
        run: npm run verify:build-info
      - name: 内部リンク検証
        run: node scripts/check-links.mjs dist "$BASE_PATH"
      - name: Playwrightブラウザ導入
        run: npx playwright install --with-deps chromium
      - name: E2E・アクセシビリティ検査 (Playwright + axe)
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:4321
      - name: Lighthouse CI（品質検査）
        run: |
          npm install -g @lhci/cli
          npx astro preview --port 4321 &
          sleep 3
          lhci collect --url="http://localhost:4321/" --url="http://localhost:4321/atlas/ja/" --numberOfRuns=1 || true
          lhci assert --preset=lighthouse:no-pwa --assertions.categories:accessibility=error || true
