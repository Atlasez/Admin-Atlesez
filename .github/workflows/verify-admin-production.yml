name: Verify admin production sync

# Read-only verification independent of any GitHub Actions deploy run.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-admin-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve expected main SHA
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "main SHAを解決できませんでした: $sha" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "expected main SHA: $sha"

      - name: Checkout expected main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.main.outputs.sha }}
          fetch-depth: 0

      - name: Verify live build identity within bounded Workers Builds delay
        env:
          EXPECTED_COMMIT: ${{ steps.main.outputs.sha }}
          BUILD_INFO_URL: https://admin.atlasez.org/build-info.json
          ALLOW_AUDIT_ONLY_ADVANCE: "true"
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if ! [[ "$latest_main" =~ ^[0-9a-f]{40}$ ]]; then
              echo "main SHAを解決できませんでした: $latest_main" >&2
              exit 1
            fi
            if [ "$latest_main" != "$EXPECTED_COMMIT" ]; then
              git fetch --quiet origin main
              git cat-file -e "$latest_main^{commit}"
              export EXPECTED_COMMIT="$latest_main"
              echo "main更新に合わせて対象SHAを再照合: $EXPECTED_COMMIT"
            fi
            if node scripts/verify-live-admin-production.mjs; then
              confirmed_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
              if [ "$confirmed_main" = "$EXPECTED_COMMIT" ]; then
                echo "ADMIN本番とmainを照合しました（試行 ${attempt}/15、SHA ${EXPECTED_COMMIT}）。"
                exit 0
              fi
              echo "照合中にmainが進んだため再確認します。"
            fi
            if [ "$attempt" -lt 15 ]; then
              echo "Workers Buildsの反映を待機します（60秒後、試行 ${attempt}/15）。"
              sleep 60
            fi
          done
          echo "ADMIN本番のbuild-infoを最大14分待ってもmainと照合できません。Workers Buildsのrun・checkout SHA・固定Worker Version・100%配信を確認し、PR/Issueへ停止理由を記録してください。" >&2
          exit 1
